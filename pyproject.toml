[project]
name = "toooaio-scripts"
version = "1.0.0"

description = """
Скрипты общего назначения: сборка документации, сборка приложений
"""

readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.1",
    "reportlab>=5.0.0",
    "gitpython>=3.1.62",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "types-reportlab>=4.5.1.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = [
    "toooaio_scripts",
]


[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true


[tool.mypy]
plugins = [
    "pydantic.mypy"
]
follow_imports = "normal"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
indent-width = 4
line-length = 120
include = [
    "./toooaio_scripts/**/*.py",
    "./tests/**/*.py"
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined variables)
    "B",      # flake8-bugbear (common design issues)
    "A",      # flake8-builtins
    "S",      # flagk8-bandit (security testing)
    "BLE",    # flake8-blind-except
    "FBT",    # flake8-boolean-trap
    "UP",     # pyupgrade (modernizes syntax)
    "SIM",    # flake8-simplify (cleans up redundant code)
    "ANN",    # flake8-annotations
    "EM",     # flake8-errmsg
    "DTZ",    # flake8-datetimez
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
    "ASYNC",  # flake8-simplify (cleans up redundant code)
]
ignore = [
    "I",    # isort (import sorting)
]
